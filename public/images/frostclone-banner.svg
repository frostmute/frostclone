<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Radial Central Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Ice Crystal Gradient -->
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Wordmark Accent Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Border Subtle Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="1200" height="380" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="16" fill="none" stroke="url(#border-grad)" stroke-width="1.5"/>

  <!-- Ambient Glow Behind Elements -->
  <rect width="1200" height="380" fill="url(#center-glow)"/>

  <!-- Centered Balanced Group -->
  <g transform="translate(600, 190)">
    
    <!-- Top Row: Icon + Wordmark aligned side by side -->
    <g transform="translate(0, -55)">
      
      <!-- Logo Mark (Clean Geometric Crystal Prism) -->
      <g transform="translate(-235, 0)">
        <!-- Outer Subtle Hexagon -->
        <polygon points="0,-48 41.5,-24 41.5,24 0,48 -41.5,24 -41.5,-24" 
                 fill="#0c1524" 
                 stroke="#0284c7" 
                 stroke-width="1.5" 
                 stroke-opacity="0.5"/>
        
        <!-- Crystalline Inner Geometry -->
        <polygon points="0,-44 0,-18 20,-6" fill="url(#ice)" opacity="0.9"/>
        <polygon points="0,-44 -38,-22 -19,-2" fill="#0284c7" opacity="0.75"/>
        <polygon points="-38,-22 -38,22 -19,-2" fill="#0369a1" opacity="0.6"/>
        <polygon points="-38,22 0,44 0,18" fill="#075985" opacity="0.8"/>
        <polygon points="0,44 38,22 19,2" fill="#38bdf8" opacity="0.85"/>
        <polygon points="38,22 38,-22 20,-6" fill="#7dd3fc" opacity="0.95"/>
        
        <!-- Center Core Prism -->
        <polygon points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" fill="#ffffff" opacity="0.95"/>
      </g>

      <!-- Wordmark Typography: Frostclone (single continuous word with kerning) -->
      <text x="-165" y="22"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif" 
            font-size="64" 
            font-weight="800" 
            letter-spacing="-1.5"><tspan fill="#ffffff">Frost</tspan><tspan fill="url(#brand-grad)">clone</tspan></text>
    </g>

    <!-- Subtitle Description -->
    <text x="0" y="30" 
          text-anchor="middle" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="19" 
          font-weight="400" 
          fill="#94a3b8" 
          letter-spacing="-0.2">
      Deterministic Website Re-Engineering &amp; Ingestion Platform
    </text>

    <!-- Bottom Feature Badges (Centered) -->
    <g transform="translate(0, 85)">
      <!-- Badge 1 -->
      <g transform="translate(-240, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#38bdf8"/>
        <text x="28" y="20.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#cbd5e1">
          Zero-LLM (0$)
        </text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(-80, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#34d399"/>
        <text x="28" y="20.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#cbd5e1">
          Byte-Exact Parity
        </text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(95, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <circle cx="16" cy="16" r="3.5" fill="#60a5fa"/>
        <text x="28" y="20.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#cbd5e1">
          Next.js 16 App
        </text>
      </g>
    </g>

  </g>
</svg>
